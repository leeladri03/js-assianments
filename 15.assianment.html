<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global vs local scope</title>
    <style>

    </style>
</head>
<body>
   <h1>Global vs Local Scope</h1>
    <button onclick="showMessage()">Show Message</button>
    <p id="message"></p>
   
</body>
</html>
<script>
     let globalMessage = "This is a global message.";
     function showMessage() {
         let localMessage = "This is a local message.";
         document.getElementById("message").textContent = globalMessage + "  " + localMessage;
     }

    
</script>
