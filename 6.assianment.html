<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>print multiples of 5</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        color: #333;
        text-align: center;
        padding: 50px;
    }
    input[type="text"] {
        padding: 10px;
        width: 200px;
        margin-right: 10px;
    }
    button {
        padding: 10px 15px;
        background-color: #28a745;
        color: white;
        border: none;
        cursor: pointer;
    }
    button:hover {
        background-color: #218838;
    }
    #result {
        font-size: 1.2em;
        margin-top: 20px;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
</style>
<body>
    <h1>Multiples of 5</h1>
    <input type="text" id="limitInput" placeholder="Enter a limit">
    <button id="printMultiples" onclick="printMultiplesOfFive()">Print Multiples of 5</button>
    <p id="result"></p>
</body>
</html>
<script>
    function printMultiplesOfFive() {
        let limit = document.getElementById("limitInput").value;
        let result = document.getElementById("result");
        if (limit === "") {
            result.innerHTML = "Please enter a limit.";
            result.style.color = "black";
            return;
        }
        limit = parseInt(limit);
        if (isNaN(limit) || limit <= 0) {
            result.innerHTML = "Please enter a valid positive number.";
            result.style.color = "red";
            return;
        }
        for (let i = 1; i <= limit; i++) {
            if (i % 5 === 0) {
                result.innerHTML += i + " ";
            }
        }
        if (result.innerHTML === "") {
            result.innerHTML = "No multiples of 5 found up to " + limit + ".";
            result.style.color = "black";
        } else {
            result.style.color = "green";
        }
        
        }

                
</script>
